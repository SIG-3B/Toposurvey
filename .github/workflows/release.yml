name: Android Release

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Jenis kenaikan versi (auto mengikuti commit message)"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      api_base_url:
        description: "Opsional: API_BASE_URL saat build APK"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Sign, Build, and Publish APK
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Determine release version
        id: version
        env:
          BUMP_TYPE_INPUT: ${{ inputs.bump_type }}
        run: |
          LATEST_TAG=$(git tag -l "v*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)

          if [ -z "$LATEST_TAG" ]; then
            VERSION_CORE=$(grep -E '^version:' frontend/pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d'+' -f1)
            if ! [[ "$VERSION_CORE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::frontend/pubspec.yaml must define a numeric MAJOR.MINOR.PATCH version."
              exit 1
            fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_CORE"
            BUMP_TYPE=""
          else
            VERSION_CORE="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_CORE"
            BUMP_TYPE="$BUMP_TYPE_INPUT"
            if [ -z "$BUMP_TYPE" ] || [ "$BUMP_TYPE" = "auto" ]; then
              COMMIT_MSG=$(git log -1 --pretty=%B)
              if echo "$COMMIT_MSG" | grep -qiE '(#major|BREAKING CHANGE|^[a-zA-Z0-9_-]+(\([^)]+\))?!:)'; then
                BUMP_TYPE="major"
              elif echo "$COMMIT_MSG" | grep -qiE '(#minor|^feat(\([^)]+\))?:)'; then
                BUMP_TYPE="minor"
              else
                BUMP_TYPE="patch"
              fi
            fi

            case "$BUMP_TYPE" in
              major|minor|patch) ;;
              *)
                echo "::error::Unsupported bump type: $BUMP_TYPE"
                exit 1
                ;;
            esac

            case "$BUMP_TYPE" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          while git show-ref --verify --quiet "refs/tags/$NEW_TAG"; do
            PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          done

          VERSION_NAME="${NEW_TAG#v}"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Release tag and APK version: $NEW_TAG"

      - name: Prepare permanent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing required repository secret: $secret_name. See docs/CI-CD.md."
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/toposurvey-release.jks"
          if [ ! -s "$RUNNER_TEMP/toposurvey-release.jks" ]; then
            echo "::error::The configured Android keystore is empty or invalid."
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/toposurvey-release.jks"

      - name: Build signed release APK
        working-directory: frontend
        env:
          API_BASE_URL_VALUE: ${{ inputs.api_base_url || vars.API_BASE_URL }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/toposurvey-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          BUILD_ARGS=(
            --release
            --android-skip-build-dependency-validation
            "--build-name=$VERSION_NAME"
            "--build-number=$VERSION_CODE"
          )
          if [ -n "$API_BASE_URL_VALUE" ]; then
            BUILD_ARGS+=("--dart-define=API_BASE_URL=$API_BASE_URL_VALUE")
          fi
          flutter build apk "${BUILD_ARGS[@]}"
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/TopoSurvey.apk
          (
            cd build/app/outputs/flutter-apk
            sha256sum TopoSurvey.apk > TopoSurvey.apk.sha256
          )

      - name: Create and push Git tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: TopoSurvey-${{ steps.version.outputs.new_tag }}
          path: |
            frontend/build/app/outputs/flutter-apk/TopoSurvey.apk
            frontend/build/app/outputs/flutter-apk/TopoSurvey.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: TopoSurvey ${{ steps.version.outputs.new_tag }}
          generate_release_notes: true
          files: |
            frontend/build/app/outputs/flutter-apk/TopoSurvey.apk
            frontend/build/app/outputs/flutter-apk/TopoSurvey.apk.sha256

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/toposurvey-release.jks"
