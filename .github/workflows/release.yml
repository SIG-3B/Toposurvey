name: Auto Tag, Build APK, and GitHub Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Tipe kenaikan versi (hanya berlaku jika sudah ada tag sebelumnya)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      api_base_url:
        description: "Opsional: API_BASE_URL saat build APK (contoh: https://api.domain.com)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Analyze and Test Flutter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: "stable"
          cache: true

      - name: Install Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Run Flutter Analyze
        working-directory: frontend
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Tests
        working-directory: frontend
        run: flutter test

  build-and-release:
    name: Auto Tag, Build APK & Release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: "stable"
          cache: true

      - name: Install Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Determine Next Version Tag (Semantic Versioning)
        id: autotag
        env:
          BUMP_TYPE_INPUT: ${{ inputs.bump_type }}
        run: |
          LATEST_TAG=$(git tag -l "v*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)

          if [ -z "$LATEST_TAG" ]; then
            PUBSPEC_VERSION=$(grep -E '^version:' frontend/pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d'+' -f1)
            VERSION_CORE="$PUBSPEC_VERSION"
            if ! [[ "$VERSION_CORE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::frontend/pubspec.yaml must define a numeric MAJOR.MINOR.PATCH version."
              exit 1
            fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_CORE"
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          else
            VERSION_CORE="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_CORE"
            BUMP_TYPE="$BUMP_TYPE_INPUT"
            if [ -z "$BUMP_TYPE" ] || [ "$BUMP_TYPE" = "auto" ]; then
              COMMIT_MSG=$(git log -1 --pretty=%B)
              if echo "$COMMIT_MSG" | grep -qiE '(#major|BREAKING CHANGE|^[a-zA-Z0-9_-]+(\([^)]+\))?!:)'; then
                BUMP_TYPE="major"
              elif echo "$COMMIT_MSG" | grep -qiE '(#minor|^feat(\([^)]+\))?:)'; then
                BUMP_TYPE="minor"
              else
                BUMP_TYPE="patch"
              fi
            fi

            case "$BUMP_TYPE" in
              major|minor|patch) ;;
              *)
                echo "::error::Unsupported bump type: $BUMP_TYPE"
                exit 1
                ;;
            esac

            case "$BUMP_TYPE" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              *)
                PATCH=$((PATCH + 1))
                ;;
            esac

            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          while git rev-parse "$NEW_TAG" >/dev/null 2>&1; do
            PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          done

          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=${NEW_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        working-directory: frontend
        env:
          API_BASE_URL_VALUE: ${{ inputs.api_base_url || vars.API_BASE_URL }}
        run: |
          BUILD_ARGS=(
            --release
            --android-skip-build-dependency-validation
            "--build-name=${{ steps.autotag.outputs.version_name }}"
            "--build-number=${{ github.run_number }}"
          )
          if [ -n "$API_BASE_URL_VALUE" ]; then
            BUILD_ARGS+=("--dart-define=API_BASE_URL=${API_BASE_URL_VALUE}")
          fi
          flutter build apk "${BUILD_ARGS[@]}"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/TopoSurvey-${{ steps.autotag.outputs.new_tag }}.apk"

      - name: Create and Push Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.autotag.outputs.new_tag }}" -m "Release ${{ steps.autotag.outputs.new_tag }}"
          git push origin "${{ steps.autotag.outputs.new_tag }}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TopoSurvey-${{ steps.autotag.outputs.new_tag }}-apk
          path: |
            frontend/build/app/outputs/flutter-apk/TopoSurvey-${{ steps.autotag.outputs.new_tag }}.apk
            frontend/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.autotag.outputs.new_tag }}
          name: TopoSurvey ${{ steps.autotag.outputs.new_tag }}
          generate_release_notes: true
          files: |
            frontend/build/app/outputs/flutter-apk/TopoSurvey-${{ steps.autotag.outputs.new_tag }}.apk
            frontend/build/app/outputs/flutter-apk/app-release.apk
