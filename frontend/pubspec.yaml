name: toposurvey
description: "Aplikasi Android untuk survei topografi."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_map: 8.3.2
  geolocator: ^14.1.2
  http: ^1.6.0
  latlong2: ^0.10.1
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.5.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  pdf: 3.13.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
